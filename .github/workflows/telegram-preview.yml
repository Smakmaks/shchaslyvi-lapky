name: "Прев'ю поста в Telegram (особисто)"

on:
  schedule:
    # Запуск кожні 30 хв, цілий день — з тієї ж причини, що й у telegram-post.yml
    # (одноразовий денний cron спостерігався з затримкою на години). Сам скрипт
    # (PREVIEW_HOUR у send_telegram_preview.py) не дає надіслати прев'ю раніше
    # 11:00 за Europe/Kyiv.
    - cron: "17,47 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Надіслати прев'ю адміну в особисті
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: "348622460"
        run: python3 scripts/send_telegram_preview.py

      - name: "Закомітити позначку previewed"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add telegram-posts.json
          git diff --cached --quiet || git commit -m "chore: позначити пост як показаний на прев'ю [skip ci]"
          git push
