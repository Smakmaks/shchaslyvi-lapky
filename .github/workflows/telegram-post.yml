name: Публікація в Telegram-канал

on:
  schedule:
    # Запуск кожні 30 хв, цілий день. Одноразовий денний cron (навіть зсунутий
    # з рівної години) спостерігався з затримкою ~8 годин у GitHub Actions —
    # пости приходили вночі замість вечора. Тому замість точного часу тепер
    # часті перевірки: сам скрипт (PUBLISH_HOUR у send_telegram_post.py)
    # не дає надіслати пост раніше 19:00 за Europe/Kyiv, а часті запуски
    # гарантують, що він спрацює невдовзі після настання цього часу.
    - cron: "13,43 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Надіслати сьогоднішній пост
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: "@shchaslyvi_lapky_shop"
        run: python3 scripts/send_telegram_post.py

      - name: "Закомітити оновлений статус (sent: true)"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add telegram-posts.json
          git diff --cached --quiet || git commit -m "chore: позначити пост як надісланий [skip ci]"
          git push
